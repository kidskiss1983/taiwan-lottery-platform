// VIP 自選號碼功能
function setupVipNumberPicker() {
  const gameSelect = document.getElementById("vipGame");
  const numberArea = document.getElementById("vipNumberArea");
  const secondArea = document.getElementById("vipSecondArea");
  const secondNumberArea = document.getElementById("vipSecondNumberArea");
  const message = document.getElementById("vipPickMessage");

  if (!gameSelect || !numberArea) return;

  const gameRules = {
    lotto649: {
      max: 49,
      count: 6
    },
    lotto539: {
      max: 39,
      count: 5
    },
    powerlottery: {
      max: 38,
      count: 6,
      secondMax: 8
    }
  };

  const selection = {
    game: "lotto649",
    numbers: [],
    secondNumber: null
  };

  window.vipPickSelection = selection;

  function renderNumbers(container, max, selected, area, count) {
    container.innerHTML = "";

    for (let n = 1; n <= max; n++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = n;
      btn.dataset.number = n;
      btn.dataset.area = area;

      const active = selected.includes(n);

      btn.style.cssText = `
        width:42px;
        height:42px;
        margin:4px;
        border-radius:50%;
        border:1px solid #64748b;
        background:${active ? "#2563eb" : "#1e293b"};
        color:white;
        font-weight:bold;
        cursor:pointer;
      `;

      container.appendChild(btn);
    }

    const countText = document.createElement("p");
    countText.textContent = `已選 ${selected.length} / ${count} 個`;
    container.appendChild(countText);
  }

  function render() {
    const rule = gameRules[selection.game];

    renderNumbers(
      numberArea,
      rule.max,
      selection.numbers,
      "main",
      rule.count
    );

    if (rule.secondMax) {
      secondArea.style.display = "block";

      renderNumbers(
        secondNumberArea,
        rule.secondMax,
        selection.secondNumber === null
          ? []
          : [selection.secondNumber],
        "second",
        1
      );
    } else {
      secondArea.style.display = "none";
    }
  }

  function handleNumberClick(event) {
    const btn = event.target.closest("button[data-number]");
    if (!btn) return;

    const number = Number(btn.dataset.number);
    const rule = gameRules[selection.game];

    if (btn.dataset.area === "main") {
      if (selection.numbers.includes(number)) {
        selection.numbers =
          selection.numbers.filter(n => n !== number);
      } else {
        if (selection.numbers.length >= rule.count) {
          message.textContent =
            `這種彩券最多只能選 ${rule.count} 個號碼。`;
          return;
        }

        selection.numbers.push(number);
      }
    } else {
      selection.secondNumber =
        selection.secondNumber === number ? null : number;
    }

    message.textContent = "";
    render();
  }

  numberArea.addEventListener("click", handleNumberClick);
  secondNumberArea.addEventListener("click", handleNumberClick);

  gameSelect.addEventListener("change", () => {
    selection.game = gameSelect.value;
    selection.numbers = [];
    selection.secondNumber = null;
    message.textContent = "";
    render();
  });

  render();
}
  // 儲存 VIP 自選號碼
async function saveVipPick(userUid) {
  const selection = window.vipPickSelection;
  const message = document.getElementById("vipPickMessage");
  const nameInput = document.getElementById("vipPickName");

  if (!selection || !message) return;

  const gameRules = {
    lotto649: 6,
    lotto539: 5,
    powerlottery: 6
  };

  const requiredCount = gameRules[selection.game];

  if (selection.numbers.length !== requiredCount) {
    message.textContent =
      `請完整選擇 ${requiredCount} 個第一區號碼。`;
    return;
  }

  if (
    selection.game === "powerlottery" &&
    selection.secondNumber === null
  ) {
    message.textContent = "請選擇威力彩第二區號碼。";
    return;
  }

  const pickName = nameInput.value.trim() || "我的自選組合";

  try {
    const picksRef = collection(
  db,
  "users",
  userUid,
  "vipPicks"
);

const editingPickId = window.editingVipPickId || null;

const targetPickRef = editingPickId
  ? doc(db, "users", userUid, "vipPicks", editingPickId)
  : doc(picksRef);

const pickData = {
  name: pickName,
  game: selection.game,
  numbers: [...selection.numbers].sort((a, b) => a - b),
  secondNumber: selection.secondNumber,
  updatedAt: serverTimestamp()
};

if (!editingPickId) {
  pickData.createdAt = serverTimestamp();
}

await setDoc(targetPickRef, pickData);

window.editingVipPickId = null;
    message.textContent = "自選號碼儲存成功！";
    nameInput.value = "";

    await loadVipPicks(userUid);

  } catch (error) {
    console.error("儲存自選號碼失敗：", error);
    message.textContent = "儲存失敗，請確認 VIP 權限或稍後再試。";
  }
}
  // 載入 VIP 自選號碼清單
async function loadVipPicks(userUid) {
  const list = document.getElementById("vipPickList");
  if (!list) return;

  list.textContent = "正在載入自選組合……";

  try {
    const picksRef = collection(
      db,
      "users",
      userUid,
      "vipPicks"
    );

    const snapshot = await getDocs(picksRef);

    list.replaceChildren();

    if (snapshot.empty) {
      list.textContent = "目前還沒有儲存任何自選組合。";
      return;
    }

    const gameNames = {
      lotto649: "大樂透",
      lotto539: "今彩539",
      powerlottery: "威力彩"
    };

    snapshot.forEach((pickDoc) => {
      const pick = pickDoc.data();
      const item = document.createElement("div");

      item.style.cssText =
        "padding:12px;margin:10px 0;border:1px solid #64748b;border-radius:8px;";

      const title = document.createElement("h4");
      title.textContent = pick.name || "我的自選組合";

      const game = document.createElement("p");
      game.textContent =
        "彩券：" + (gameNames[pick.game] || pick.game);

      const numbers = document.createElement("p");
      numbers.textContent =
        "第一區：" + (pick.numbers || []).join("、");

      item.append(title, game, numbers);
// 刪除自選組合
const deleteButton = document.createElement("button");
deleteButton.textContent = "刪除此組合";
deleteButton.style.cssText =
  "margin:8px 0;padding:8px 14px;background:#dc2626;color:white;border:0;border-radius:6px;cursor:pointer;";

deleteButton.onclick = async () => {
  if (!confirm(`確定要刪除「${pick.name || "我的自選組合"}」嗎？`)) {

  }
if (window.editingVipPickId === pickDoc.id) {

}

};

// 編輯自選組合
const editButton = document.createElement("button");
editButton.textContent = "編輯組合";
editButton.style.cssText =
  "margin:8px 8px 8px 0;padding:8px 14px;background:#2563eb;color:white;border:0;border-radius:6px;cursor:pointer;";

editButton.onclick = () => {
  window.editingVipPickId = pickDoc.id;
  const gameSelect = document.getElementById("vipGame");
  const nameInput = document.getElementById("vipPickName");
  const numberArea = document.getElementById("vipNumberArea");
  const secondNumberArea = document.getElementById("vipSecondNumberArea");

  // 切換彩券種類，重新產生號碼按鈕
  gameSelect.value = pick.game;
  gameSelect.dispatchEvent(new Event("change"));

  // 帶入組合名稱
  nameInput.value = pick.name || "";

  // 帶入第一區號碼
  (pick.numbers || []).forEach(number => {
    const button = [...numberArea.querySelectorAll("button[data-number]")]
      .find(btn => Number(btn.dataset.number) === number);

    if (button) button.click();
  });

  // 帶入威力彩第二區號碼
  if (pick.game === "powerlottery" && pick.secondNumber != null) {
    const button = [...secondNumberArea.querySelectorAll("button[data-number]")]
      .find(btn => Number(btn.dataset.number) === pick.secondNumber);

    if (button) button.click();
  }

  document.getElementById("vipPickMessage").textContent =
    "已載入原有組合，修改後請儲存。";
};

item.appendChild(editButton);
      item.appendChild(deleteButton);
      if (pick.game === "powerlottery") {
        const second = document.createElement("p");
        second.textContent =
          "第二區：" + (pick.secondNumber ?? "未選擇");
        item.appendChild(second);
      }

      list.appendChild(item);
    });

  } catch (error) {
    console.error("載入自選組合失敗：", error);
    list.textContent = "載入失敗：" + error.message;
  }
}
  // 顯示註冊與登入介面
  function showLogin() {
    status.innerHTML = `
      <h3>會員專區</h3>

      <section style="margin:20px 0">
        <h4>註冊新會員</h4>
        <input id="registerEmail" type="email"
          placeholder="電子郵件"
          autocomplete="email"
          style="width:100%;padding:12px;margin:6px 0">

        <input id="registerPassword" type="password"
          placeholder="密碼（至少 6 個字元）"
          autocomplete="new-password"
          style="width:100%;padding:12px;margin:6px 0">

        <button id="registerBtn">註冊會員</button>
      </section>

      <hr>

      <section style="margin:20px 0">
        <h4>已有會員帳號？</h4>
        <input id="loginEmail" type="email"
          placeholder="電子郵件"
          autocomplete="email"
          style="width:100%;padding:12px;margin:6px 0">

        <input id="loginPassword" type="password"
          placeholder="密碼"
          autocomplete="current-password"
          style="width:100%;padding:12px;margin:6px 0">

        <button id="loginBtn">會員登入</button>
        <button id="forgotPassword" type="button">
  忘記密碼？
</button>
      </section>

      <hr>
      <button id="anonymousBtn">訪客登入</button>

            <p id="authMessage" style="color:#fbbf24"></p>
    `;

    const message = document.getElementById("authMessage");
    // 註冊會員
    document.getElementById("registerBtn").onclick = async () => {
      const email = document.getElementById("registerEmail").value.trim();
      const password = document.getElementById("registerPassword").value;

      if (!email || password.length < 6) {
        message.textContent = "請輸入正確電子郵件及至少 6 位密碼";
        return;
      }

      try {
        message.textContent = "正在建立會員帳號…";

        let currentUser = auth.currentUser;

        // 若尚未登入，先建立匿名帳號
        if (!currentUser) {
          await signInAnonymously(auth);
          currentUser = auth.currentUser;
        }

        const credential = EmailAuthProvider.credential(email, password);

        // 將匿名帳號升級為正式會員，保留 UID
        const result = await linkWithCredential(currentUser, credential);

        // 寄送電子郵件驗證信
        await sendEmailVerification(result.user);

        alert("會員註冊成功！請到電子信箱收取驗證信。");

      } catch (error) {
        console.error(error);
        message.textContent = "註冊失敗：" + error.message;
      }
    };

    // 會員登入
    document.getElementById("loginBtn").onclick = async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      try {
        message.textContent = "正在登入…";

        await signInWithEmailAndPassword(auth, email, password);

      } catch (error) {
        console.error(error);
        message.textContent = "登入失敗：" + error.message;
      }
    };
document.getElementById("forgotPassword").onclick = async () => {
  const email = document.getElementById("loginEmail").value.trim();

  if (!email) {
    alert("請先輸入註冊時使用的 Email！");
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    alert("密碼重設信已寄出！請到信箱查看。");
  } catch (error) {
    console.error("密碼重設失敗：", error);
    alert("寄送失敗：" + error.message);
  }
};
    // 訪客登入
    document.getElementById("anonymousBtn").onclick = async () => {
      try {
        await signInAnonymously(auth);
      } catch (error) {
        message.textContent = "訪客登入失敗：" + error.message;
      }
    };
  }

  // 顯示登入狀態與會員權限
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    showLogin();
    return;
  }

  // 匿名訪客
  if (user.isAnonymous) {
    status.innerHTML = `
      <h3>訪客登入成功</h3>
      <p>目前身分：匿名訪客</p>
      <p>可以查看三種彩券的開獎資料。</p>
      <button id="logout">登出</button>
      <button id="memberArea">會員註冊／登入</button>
    `;

    document.getElementById("logout").onclick =
      () => signOut(auth);

    document.getElementById("memberArea").onclick =
      showLogin;

    return;
  }

  // 載入會員權限
  status.innerHTML = "<p>正在讀取會員資料...</p>";

  try {

    // 查詢管理員名單
    const adminRef = doc(db, "admins", user.uid);
    const adminSnap = await getDoc(adminRef);

    const isAdmin = adminSnap.exists() && user.emailVerified === true;

    // 查詢會員資料
    const userRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userRef);

    let isVIP = false;

    // 第一次登入，自動建立基本會員資料
    if (!userSnap.exists()) {

      await setDoc(userRef, {
        email: user.email || "",
        role: "member",
        vip: false,
        createdAt: serverTimestamp()
      });

       } else {

      const memberData = userSnap.data();

      isVIP = memberData.vip === true;

      // 檢查 VIP 到期日
      if (isVIP && memberData.vipExpiresAt) {

        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");

        const todayString = `${year}-${month}-${day}`;

        // 到期日當天仍有效，隔天開始失效
        if (todayString > memberData.vipExpiresAt) {
          isVIP = false;
        }
      }

    }

    // 顯示會員身分
    let roleText = "一般會員";

    if (isAdmin) {
      roleText = "管理員";
    } else if (isVIP) {
      roleText = "VIP 會員";
    }

    status.innerHTML = `
  <h3>登入成功</h3>
  <p id="memberEmail"></p>
  <p>目前身分：<strong>${roleText}</strong></p>
  <p id="verifyStatus"></p>
  <button id="resendVerify">重新寄送驗證信</button>
    ${
    (isVIP || isAdmin) ? `
      <hr>
      <h3>VIP 自選號碼</h3>
      <p>選擇彩券種類，自行挑選號碼並儲存組合。</p>

      <div id="vipPicksPanel">
        <label>選擇彩券</label>
        <select id="vipGame">
          <option value="lotto649">大樂透</option>
          <option value="lotto539">今彩539</option>
          <option value="powerlottery">威力彩</option>
        </select>

       <p>一般號碼（選擇 6 個）：</p>
<div id="vipNumberArea"></div>

<div id="vipSpecialArea" style="display:none">
  <p>大樂透特別號（另外選擇 1 個）：</p>
  <div id="vipSpecialNumberArea"></div>
</div>

        <div id="vipSecondArea" style="display:none">
          <p>威力彩第二區：</p>
          <div id="vipSecondNumberArea"></div>
        </div>

        <p>組合名稱：</p>
        <input
          id="vipPickName"
          type="text"
          placeholder="例如：我的幸運號碼"
        >

        <p>
          <button id="saveVipPick">儲存自選組合</button>
        </p>

        <p id="vipPickMessage"></p>

        <hr>
        <h3>我的自選組合</h3>
        <div id="vipPickList"></div>
      </div>
    ` : ""
  }
  ${
    isAdmin ? `
      <hr>
      <h3>管理員專區</h3>
      <button id="openAdmin">開啟管理中心</button>
      <div id="adminPanel" style="display:none;margin-top:20px">
        <h3>會員管理</h3>
        <button id="loadMembers">載入會員清單</button>
        <div id="memberList" style="margin-top:20px"></div>
      </div>
    ` : ""
  }
  <button id="logout">登出</button>
`;
    // 啟動 VIP 自選號碼及儲存功能
if (isVIP || isAdmin) {

  // 顯示可選號碼
  setupVipNumberPicker();

  // 綁定儲存按鈕
  document.getElementById("saveVipPick").onclick = () => {
    saveVipPick(user.uid);
  };

  // 載入已儲存的自選組合
  await loadVipPicks(user.uid);
}
    if (isAdmin) {
  document.getElementById("openAdmin").onclick = () => {
    document.getElementById("adminPanel").style.display = "block";
  };

  document.getElementById("loadMembers").onclick = async () => {
    const btn = document.getElementById("loadMembers");
    const area = document.getElementById("memberList");

    btn.disabled = true;
    btn.textContent = "正在載入會員資料...";
    area.textContent = "請稍候...";

    try {
      const snapshot = await getDocs(collection(db, "users"));

      const members = snapshot.docs.map(d => ({
        uid: d.id,
        ...d.data()
      }));

      // 自動檢查並清除已過期的 VIP
      const today = new Date();
      const todayString =
        `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;

      for (const member of members) {
        if (
          member.vip === true &&
          typeof member.vipExpiresAt === "string" &&
          /^\d{4}-\d{2}-\d{2}$/.test(member.vipExpiresAt) &&
          todayString > member.vipExpiresAt
        ) {
         await updateDoc(doc(db, "users", member.uid), {
  vip: false,
  vipExpiresAt: null,
  vipExpiresAtTimestamp: null,
  vipUpdatedAt: serverTimestamp()
});

          // 同步更新目前畫面使用的會員資料
          member.vip = false;
          member.vipExpiresAt = null;

          console.log("已自動取消過期 VIP：", member.email);
        }
      // 替舊有有效期限 VIP 補上 Timestamp
else if (
  member.vip === true &&
  typeof member.vipExpiresAt === "string" &&
  /^\d{4}-\d{2}-\d{2}$/.test(member.vipExpiresAt) &&
  !member.vipExpiresAtTimestamp
) {
  const expiryTimestamp =
    new Date(`${member.vipExpiresAt}T00:00:00`);

  // 到期日隔天 00:00 才失效
  expiryTimestamp.setDate(expiryTimestamp.getDate() + 1);

  await updateDoc(doc(db, "users", member.uid), {
    vipExpiresAtTimestamp: expiryTimestamp
  });

  member.vipExpiresAtTimestamp = expiryTimestamp;

  console.log("已補上 VIP 到期 Timestamp：", member.email);
}
      }

      const vipCount = members.filter(m => m.vip === true).length;

      area.replaceChildren();

      const summary = document.createElement("p");
      summary.textContent =
        `會員總數：${members.length} 人｜VIP：${vipCount} 人｜一般會員：${members.length - vipCount} 人`;
      area.appendChild(summary);

      if (members.length === 0) {
        area.appendChild(document.createTextNode("目前沒有會員資料。"));
        return;
      }

      const table = document.createElement("table");
      table.style.width = "100%";
      table.style.borderCollapse = "collapse";

      const headers = [
  "電子郵件",
  "會員身分",
  "VIP 狀態",
  "註冊日期",
  "VIP 到期日",
  "管理操作"
];
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");

      headers.forEach(title => {
        const th = document.createElement("th");
        th.textContent = title;
        th.style.padding = "10px";
        th.style.borderBottom = "1px solid #64748b";
        th.style.textAlign = "left";
        headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");

      members.forEach(member => {
        const tr = document.createElement("tr");

        const created = member.createdAt?.toDate
          ? member.createdAt.toDate().toLocaleDateString("zh-TW")
          : "無資料";

const values = [
  member.email || "無資料",
  member.role || "member",
  member.vip === true ? "VIP" : "一般會員",
  created,
  member.vip === true
    ? (member.vipExpiresAt || "永久")
    : "—"
];
values.forEach(value => {
  const td = document.createElement("td");
  td.textContent = value;
  td.style.padding = "10px";
  td.style.borderBottom = "1px solid #334155";
  tr.appendChild(td);
});

// VIP 管理操作欄
const actionTd = document.createElement("td");
actionTd.style.padding = "10px";
actionTd.style.borderBottom = "1px solid #334155";

const vipButton = document.createElement("button");

if (member.vip === true) {
  vipButton.textContent = "取消 VIP";
  vipButton.style.background = "#b91c1c";
} else {
  vipButton.textContent = "升級 VIP";
  vipButton.style.background = "#0d9488";
}


vipButton.onclick = async () => {
  const isVip = member.vip === true;
  let expiryDate = null;
  let expiryTimestamp = null;
  if (isVip) {
    if (!confirm(`確定要取消 ${member.email} 的 VIP 資格嗎？`)) {
      return;
    }
  } else {
    // 建立 VIP 期限選單
    const choice = document.createElement("div");

    choice.style.cssText = `
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.75);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:99999;
      padding:20px;
    `;

    choice.innerHTML = `
      <div style="
        background:#1e293b;
        color:white;
        padding:24px;
        border-radius:16px;
        width:100%;
        max-width:360px;
      ">
        <h3 style="margin-top:0">選擇 VIP 期限</h3>

        <select id="vipDuration" style="
          width:100%;
          padding:12px;
          margin-bottom:16px;
          border-radius:8px;
          font-size:16px;
        ">
          <option value="0">永久 VIP</option>
          <option value="30">30 天</option>
          <option value="90">90 天</option>
          <option value="180">180 天</option>
          <option value="365">365 天</option>
          <option value="custom">自訂到期日</option>
        </select>

        <input id="vipCustomDate"
          type="date"
          style="
            display:none;
            width:100%;
            padding:12px;
            margin-bottom:16px;
            box-sizing:border-box;
          "
        >

        <div style="display:flex;gap:10px">
          <button id="vipCancel" style="
            flex:1;padding:12px;border:0;
            border-radius:8px;background:#64748b;color:white;
          ">取消</button>

          <button id="vipConfirm" style="
            flex:1;padding:12px;border:0;
            border-radius:8px;background:#2563eb;color:white;
          ">確認升級</button>
        </div>
      </div>
    `;

    document.body.appendChild(choice);

    const duration = choice.querySelector("#vipDuration");
    const customDate = choice.querySelector("#vipCustomDate");

    duration.onchange = () => {
      customDate.style.display =
        duration.value === "custom" ? "block" : "none";
    };

    const selected = await new Promise(resolve => {
      choice.querySelector("#vipCancel").onclick = () => {
        choice.remove();
        resolve(null);
      };

      choice.querySelector("#vipConfirm").onclick = () => {
        const value = duration.value;

        if (value === "custom") {
          const date = customDate.value;
          const today = new Date();
          today.setHours(0, 0, 0, 0);

          if (!date || new Date(date + "T00:00:00") <= today) {
            alert("請選擇有效的未來到期日！");
            return;
          }

          choice.remove();
          resolve(date);
        } else {
          choice.remove();
          resolve(value);
        }
      };
    });

    if (selected === null) return;

    if (selected === "0") {
      expiryDate = null;
    } else if (selected === "custom") {
      return;
    } else if (selected.match(/^\d{4}-\d{2}-\d{2}$/)) {
      expiryDate = selected;
    } else {
      const date = new Date();
      date.setDate(date.getDate() + Number(selected));

      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      expiryDate = `${year}-${month}-${day}`;
    }
  }
// 設定 VIP 到期時間：到期日當天有效，隔天 00:00 失效
if (!isVip && expiryDate) {
  expiryTimestamp = new Date(`${expiryDate}T00:00:00`);
  expiryTimestamp.setDate(expiryTimestamp.getDate() + 1);
}
  const action = isVip ? "取消 VIP" : "升級 VIP";

  vipButton.disabled = true;

  try {
await updateDoc(doc(db, "users", member.uid), {
  vip: !isVip,
  vipExpiresAt: isVip ? null : expiryDate,
  vipExpiresAtTimestamp: isVip ? null : expiryTimestamp,
  vipUpdatedAt: serverTimestamp()
});

    alert(`${action}成功！`);
    document.getElementById("loadMembers").click();

  } catch (error) {
    console.error("VIP 更新失敗：", error);
    alert("操作失敗：" + error.message);
    vipButton.disabled = false;
  }
};

actionTd.appendChild(vipButton);
tr.appendChild(actionTd);

tbody.appendChild(tr);

}); // 結束 members.forEach

table.appendChild(tbody);
      area.appendChild(table);

    } catch (error) {
      console.error("會員清單讀取失敗：", error);
      area.textContent = "讀取失敗：" + error.message;

    } finally {
      btn.disabled = false;
      btn.textContent = "重新載入會員清單";
    }
  };
}

    document.getElementById("memberEmail").textContent =
      "帳號：" + (user.email || "");

    document.getElementById("verifyStatus").textContent =
      user.emailVerified
        ? "電子郵件已驗證"
        : "電子郵件尚未驗證";

    document.getElementById("resendVerify").style.display =
      user.emailVerified ? "none" : "inline-block";

    document.getElementById("resendVerify").onclick =
      async () => {
        try {
          await sendEmailVerification(user);
          alert("驗證信已重新寄出，請檢查電子信箱。");
        } catch (error) {
          alert("寄送失敗：" + error.message);
        }
      };

    document.getElementById("logout").onclick =
      () => signOut(auth);

  } catch (error) {

    console.error("會員資料讀取失敗：", error);

    status.innerHTML = `
      <h3>會員資料讀取失敗</h3>
      <p id="errorMessage"></p>
      <button id="logout">登出</button>
    `;

    document.getElementById("errorMessage").textContent =
      error.message;

    document.getElementById("logout").onclick =
      () => signOut(auth);
  }

});
</script>
</body>
</html>
