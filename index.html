
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>台灣彩券分析平台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #101827;
      color: #f1f5f9;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }
    .container {
      max-width: 900px;
      margin: auto;
    }
    header {
      text-align: center;
      padding: 32px 12px;
    }
    h1 { color: #fbbf24; }
    .subtitle { color: #94a3b8; }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .game {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 24px;
      text-align: center;
    }
    .game h2 { color: #fbbf24; }
    .status {
      margin-top: 24px;
      padding: 16px;
      background: #1e293b;
      border-radius: 12px;
      color: #cbd5e1;
      text-align: center;
    }
    footer {
      margin-top: 36px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>台灣彩券分析平台</h1>
      <p class="subtitle">三大彩券開獎資料與數據分析</p>
    </header>

    <section class="games">
      <article class="game">
        <h2>大樂透</h2>
        <p>6 個號碼：1～49</p>
        <p>特別號：1～49</p>
      </article>

      <article class="game">
        <h2>今彩 539</h2>
        <p>5 個號碼：1～39</p>
      </article>

      <article class="game">
        <h2>威力彩</h2>
        <p>第一區：6 個號碼，1～38</p>
        <p>第二區：1 個號碼，1～8</p>
      </article>
    </section>

    <section class="status">
      <p>平台首頁已建立</p>
      <p>開獎資料與會員功能建置中</p>
    </section>

    <footer>
      本平台僅提供歷史資料與統計分析，不保證中獎。
    </footer>
  </main>
  

<script type="module">
  import {
  auth,
  db,
  onAuthStateChanged,
  signInAnonymously,
  signInWithEmailAndPassword,
  signOut,
  sendEmailVerification,
  EmailAuthProvider,
  linkWithCredential,
  doc,
  getDoc,
  getDocs,
  collection,
  setDoc,
  serverTimestamp
} from "./firebase.js";

  const status = document.querySelector(".status");

  // 顯示註冊與登入介面
  function showLogin() {
     status.innerHTML = `
      <h3>登入成功</h3>

      <p id="memberEmail"></p>
      <p>目前身分：<strong>${roleText}</strong></p>
      <p id="verifyStatus"></p>

      <button id="resendVerify">
        重新寄送驗證信
      </button>

      ${isAdmin ? `
        <hr style="margin:24px 0;border-color:#475569">

        <section style="padding:16px;background:#0f172a;border-radius:12px">
          <h3 style="color:#fbbf24">管理員專區</h3>
          <p>歡迎使用台灣彩券平台管理系統。</p>
          <button id="openAdmin">進入管理員專區</button>
          
<div id="adminPanel" style="display:none;margin-top:20px">
  <h3>平台管理中心</h3>

  <hr>

  <h3>一、會員管理</h3>
  <p>查看平台所有註冊會員及 VIP 狀態。</p>

  <button id="loadMembers">
    載入會員清單
  </button>

  <div id="memberList" style="margin-top:20px;overflow-x:auto">
    <p>尚未載入會員資料。</p>
  </div>

  <hr style="margin:24px 0">

  <h3>二、開獎資料管理</h3>
  <p>開獎資料管理功能建置中。</p>

  <hr style="margin:24px 0">

  <h3>三、VIP 管理</h3>
  <p>VIP 開通、取消及期限設定功能建置中。</p>

  <hr style="margin:24px 0">

  <h3>四、管理員管理</h3>
  <p>管理員權限管理功能建置中。</p>
</div>
</section>
` : ""}

  <button id="logout">登出</button>
`;

if (isAdmin) {


document.getElementById("openAdmin").onclick = () => {
document.getElementById("adminPanel").style.display = "block";
};

document.getElementById("loadMembers").onclick = async () => {

const btn = document.getElementById("loadMembers");
const area = document.getElementById("memberList");

btn.disabled = true;
btn.textContent = "正在載入會員資料...";
area.textContent = "請稍候...";

try {

const snapshot = await getDocs(collection(db, "users"));

const members = snapshot.docs.map(d => ({
uid: d.id,
...d.data()
}));

const vipCount = members.filter(m => m.vip === true).length;

area.replaceChildren();

const summary = document.createElement("p");
summary.textContent =
  `會員總數：${members.length} 人｜VIP：${vipCount} 人｜一般會員：${members.length - vipCount} 人`;

area.appendChild(summary);

if (members.length === 0) {
        area.appendChild(document.createTextNode("目前沒有會員資料。"));
        return;
      }

      const table = document.createElement("table");

table.style.width = "100%";
      table.style.borderCollapse = "collapse";

      const headers = ["電子郵件", "會員身分", "VIP 狀態", "註冊日期"];

const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");

headers.forEach(title => {
        const th = document.createElement("th");
        th.textContent = title;
        th.style.padding = "10px";
        th.style.borderBottom = "1px solid #64748b";
        th.style.textAlign = "left";
        headerRow.appendChild(th);
      });

thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");

      members.forEach(member => {

        const tr = document.createElement("tr");

const created = member.createdAt?.toDate
          ? member.createdAt.toDate().toLocaleDateString("zh-TW")
          : "無資料";

const values = [
          member.email || "無資料",
          member.role || "member",
          member.vip === true ? "VIP" : "一般會員",
          created
        ];

values.forEach(value => {
          const td = document.createElement("td");
          td.textContent = value;
          td.style.padding = "10px";
          td.style.borderBottom = "1px solid #334155";
          tr.appendChild(td);
        });

tbody.appendChild(tr);
      });

table.appendChild(tbody);
      area.appendChild(table);

    } catch (error) {

      console.error("會員清單讀取失敗：", error);

area.textContent =
        "讀取失敗：" + error.message;

    } finally {

btn.disabled = false;
      btn.textContent = "重新載入會員清單";

    }

  };

}


    document.getElementById("memberEmail").textContent =
      "帳號：" + (user.email || "");

    document.getElementById("verifyStatus").textContent =
      user.emailVerified
        ? "電子郵件已驗證"
        : "電子郵件尚未驗證";

    document.getElementById("resendVerify").style.display =
      user.emailVerified ? "none" : "inline-block";

    document.getElementById("resendVerify").onclick =
      async () => {
        try {
          await sendEmailVerification(user);
          alert("驗證信已重新寄出，請檢查電子信箱。");
        } catch (error) {
          alert("寄送失敗：" + error.message);
        }
      };

    document.getElementById("logout").onclick =
      () => signOut(auth);

  } catch (error) {

    console.error("會員資料讀取失敗：", error);

    status.innerHTML = `
      <h3>會員資料讀取失敗</h3>
      <p id="errorMessage"></p>
      <button id="logout">登出</button>
    `;

    document.getElementById("errorMessage").textContent =
      error.message;

    document.getElementById("logout").onclick =
      () => signOut(auth);
  }

});
</script>
</body>
</html>
