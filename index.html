
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>台灣彩券分析平台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #101827;
      color: #f1f5f9;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }
    .container {
      max-width: 900px;
      margin: auto;
    }
    header {
      text-align: center;
      padding: 32px 12px;
    }
    h1 { color: #fbbf24; }
    .subtitle { color: #94a3b8; }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .game {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 24px;
      text-align: center;
    }
    .game h2 { color: #fbbf24; }
    .status {
      margin-top: 24px;
      padding: 16px;
      background: #1e293b;
      border-radius: 12px;
      color: #cbd5e1;
      text-align: center;
    }
    footer {
      margin-top: 36px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }
    /* 全站按鈕美化 */
button {
  border: 1px solid #3b82f6;
  border-radius: 10px;
  padding: 11px 20px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #ffffff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  margin: 5px 4px;
}

button:hover {
  filter: brightness(1.2);
  transform: translateY(-2px);
  box-shadow: 0 5px 15px #2563eb55;
}

button:active {
  transform: scale(0.97);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* 會員清單按鈕 */
#loadMembers {
  background: linear-gradient(135deg, #0d9488, #0f766e);
  border-color: #14b8a6;
}

/* 登出按鈕 */
#logout {
  background: linear-gradient(135deg, #475569, #334155);
  border-color: #64748b;
}
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>台灣彩券分析平台</h1>
      <p class="subtitle">三大彩券開獎資料與數據分析</p>
    </header>

    <section class="games">
      <article class="game">
        <h2>大樂透</h2>
        <p>6 個號碼：1～49</p>
        <p>特別號：1～49</p>
      </article>

      <article class="game">
        <h2>今彩 539</h2>
        <p>5 個號碼：1～39</p>
      </article>

      <article class="game">
        <h2>威力彩</h2>
        <p>第一區：6 個號碼，1～38</p>
        <p>第二區：1 個號碼，1～8</p>
      </article>
    </section>

    <section class="status">
      <p>平台首頁已建立</p>
      <p>開獎資料與會員功能建置中</p>
    </section>

    <footer>
      本平台僅提供歷史資料與統計分析，不保證中獎。
    </footer>
  </main>
  

<script type="module">
  import {
  auth,
  db,
  onAuthStateChanged,
  signInAnonymously,
  signInWithEmailAndPassword,
  signOut,
  sendEmailVerification,
  EmailAuthProvider,
  linkWithCredential,
  doc,
  getDoc,
  setDoc,
  serverTimestamp,
  collection,
  getDocs
} from "./firebase.js";

  const status = document.querySelector(".status");

  // 顯示註冊與登入介面
  function showLogin() {
    status.innerHTML = `
      <h3>會員專區</h3>

      <section style="margin:20px 0">
        <h4>註冊新會員</h4>
        <input id="registerEmail" type="email"
          placeholder="電子郵件"
          autocomplete="email"
          style="width:100%;padding:12px;margin:6px 0">

        <input id="registerPassword" type="password"
          placeholder="密碼（至少 6 個字元）"
          autocomplete="new-password"
          style="width:100%;padding:12px;margin:6px 0">

        <button id="registerBtn">註冊會員</button>
      </section>

      <hr>

      <section style="margin:20px 0">
        <h4>已有會員帳號？</h4>
        <input id="loginEmail" type="email"
          placeholder="電子郵件"
          autocomplete="email"
          style="width:100%;padding:12px;margin:6px 0">

        <input id="loginPassword" type="password"
          placeholder="密碼"
          autocomplete="current-password"
          style="width:100%;padding:12px;margin:6px 0">

        <button id="loginBtn">會員登入</button>
      </section>

      <hr>
      <button id="anonymousBtn">訪客登入</button>

      <p id="authMessage" style="color:#fbbf24"></p>
    `;

    const message = document.getElementById("authMessage");

    // 註冊會員
    document.getElementById("registerBtn").onclick = async () => {
      const email = document.getElementById("registerEmail").value.trim();
      const password = document.getElementById("registerPassword").value;

      if (!email || password.length < 6) {
        message.textContent = "請輸入正確電子郵件及至少 6 位密碼";
        return;
      }

      try {
        message.textContent = "正在建立會員帳號…";

        let currentUser = auth.currentUser;

        // 若尚未登入，先建立匿名帳號
        if (!currentUser) {
          await signInAnonymously(auth);
          currentUser = auth.currentUser;
        }

        const credential = EmailAuthProvider.credential(email, password);

        // 將匿名帳號升級為正式會員，保留 UID
        const result = await linkWithCredential(currentUser, credential);

        // 寄送電子郵件驗證信
        await sendEmailVerification(result.user);

        alert("會員註冊成功！請到電子信箱收取驗證信。");

      } catch (error) {
        console.error(error);
        message.textContent = "註冊失敗：" + error.message;
      }
    };

    // 會員登入
    document.getElementById("loginBtn").onclick = async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      try {
        message.textContent = "正在登入…";

        await signInWithEmailAndPassword(auth, email, password);

      } catch (error) {
        console.error(error);
        message.textContent = "登入失敗：" + error.message;
      }
    };

    // 訪客登入
    document.getElementById("anonymousBtn").onclick = async () => {
      try {
        await signInAnonymously(auth);
      } catch (error) {
        message.textContent = "訪客登入失敗：" + error.message;
      }
    };
  }

  // 顯示登入狀態與會員權限
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    showLogin();
    return;
  }

  // 匿名訪客
  if (user.isAnonymous) {
    status.innerHTML = `
      <h3>訪客登入成功</h3>
      <p>目前身分：匿名訪客</p>
      <p>可以查看三種彩券的開獎資料。</p>
      <button id="logout">登出</button>
      <button id="memberArea">會員註冊／登入</button>
    `;

    document.getElementById("logout").onclick =
      () => signOut(auth);

    document.getElementById("memberArea").onclick =
      showLogin;

    return;
  }

  // 載入會員權限
  status.innerHTML = "<p>正在讀取會員資料...</p>";

  try {

    // 查詢管理員名單
    const adminRef = doc(db, "admins", user.uid);
    const adminSnap = await getDoc(adminRef);

    const isAdmin = adminSnap.exists();

    // 查詢會員資料
    const userRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userRef);

    let isVIP = false;

    // 第一次登入，自動建立基本會員資料
    if (!userSnap.exists()) {

      await setDoc(userRef, {
        email: user.email || "",
        role: "member",
        vip: false,
        createdAt: serverTimestamp()
      });

    } else {

      isVIP = userSnap.data().vip === true;

    }

    // 顯示會員身分
    let roleText = "一般會員";

    if (isAdmin) {
      roleText = "管理員";
    } else if (isVIP) {
      roleText = "VIP 會員";
    }

    status.innerHTML = `
  <h3>登入成功</h3>
  <p id="memberEmail"></p>
  <p>目前身分：<strong>${roleText}</strong></p>
  <p id="verifyStatus"></p>
  <button id="resendVerify">重新寄送驗證信</button>
  ${
    isAdmin ? `
      <hr>
      <h3>管理員專區</h3>
      <button id="openAdmin">開啟管理中心</button>
      <div id="adminPanel" style="display:none;margin-top:20px">
        <h3>會員管理</h3>
        <button id="loadMembers">載入會員清單</button>
        <div id="memberList" style="margin-top:20px"></div>
      </div>
    ` : ""
  }
  <button id="logout">登出</button>
`;
    if (isAdmin) {
  document.getElementById("openAdmin").onclick = () => {
    document.getElementById("adminPanel").style.display = "block";
  };

  document.getElementById("loadMembers").onclick = async () => {
    const btn = document.getElementById("loadMembers");
    const area = document.getElementById("memberList");

    btn.disabled = true;
    btn.textContent = "正在載入會員資料...";
    area.textContent = "請稍候...";

    try {
      const snapshot = await getDocs(collection(db, "users"));

      const members = snapshot.docs.map(d => ({
        uid: d.id,
        ...d.data()
      }));

      const vipCount = members.filter(m => m.vip === true).length;

      area.replaceChildren();

      const summary = document.createElement("p");
      summary.textContent =
        `會員總數：${members.length} 人｜VIP：${vipCount} 人｜一般會員：${members.length - vipCount} 人`;
      area.appendChild(summary);

      if (members.length === 0) {
        area.appendChild(document.createTextNode("目前沒有會員資料。"));
        return;
      }

      const table = document.createElement("table");
      table.style.width = "100%";
      table.style.borderCollapse = "collapse";

      const headers = ["電子郵件", "會員身分", "VIP 狀態", "註冊日期"];
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");

      headers.forEach(title => {
        const th = document.createElement("th");
        th.textContent = title;
        th.style.padding = "10px";
        th.style.borderBottom = "1px solid #64748b";
        th.style.textAlign = "left";
        headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");

      members.forEach(member => {
        const tr = document.createElement("tr");

        const created = member.createdAt?.toDate
          ? member.createdAt.toDate().toLocaleDateString("zh-TW")
          : "無資料";

        const values = [
          member.email || "無資料",
          member.role || "member",
          member.vip === true ? "VIP" : "一般會員",
          created
        ];

        values.forEach(value => {
          const td = document.createElement("td");
          td.textContent = value;
          td.style.padding = "10px";
          td.style.borderBottom = "1px solid #334155";
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      area.appendChild(table);

    } catch (error) {
      console.error("會員清單讀取失敗：", error);
      area.textContent = "讀取失敗：" + error.message;

    } finally {
      btn.disabled = false;
      btn.textContent = "重新載入會員清單";
    }
  };
}

    document.getElementById("memberEmail").textContent =
      "帳號：" + (user.email || "");

    document.getElementById("verifyStatus").textContent =
      user.emailVerified
        ? "電子郵件已驗證"
        : "電子郵件尚未驗證";

    document.getElementById("resendVerify").style.display =
      user.emailVerified ? "none" : "inline-block";

    document.getElementById("resendVerify").onclick =
      async () => {
        try {
          await sendEmailVerification(user);
          alert("驗證信已重新寄出，請檢查電子信箱。");
        } catch (error) {
          alert("寄送失敗：" + error.message);
        }
      };

    document.getElementById("logout").onclick =
      () => signOut(auth);

  } catch (error) {

    console.error("會員資料讀取失敗：", error);

    status.innerHTML = `
      <h3>會員資料讀取失敗</h3>
      <p id="errorMessage"></p>
      <button id="logout">登出</button>
    `;

    document.getElementById("errorMessage").textContent =
      error.message;

    document.getElementById("logout").onclick =
      () => signOut(auth);
  }

});
</script>
</body>
</html>
