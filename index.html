
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>台灣彩券分析平台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #101827;
      color: #f1f5f9;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }
    .container {
      max-width: 900px;
      margin: auto;
    }
    header {
      text-align: center;
      padding: 32px 12px;
    }
    h1 { color: #fbbf24; }
    .subtitle { color: #94a3b8; }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .game {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 24px;
      text-align: center;
    }
    .game h2 { color: #fbbf24; }
    .status {
      margin-top: 24px;
      padding: 16px;
      background: #1e293b;
      border-radius: 12px;
      color: #cbd5e1;
      text-align: center;
    }
    footer {
      margin-top: 36px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }
    /* 全站按鈕美化 */
button {
  border: 1px solid #3b82f6;
  border-radius: 10px;
  padding: 11px 20px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #ffffff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  margin: 5px 4px;
}

button:hover {
  filter: brightness(1.2);
  transform: translateY(-2px);
  box-shadow: 0 5px 15px #2563eb55;
}

button:active {
  transform: scale(0.97);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* 會員清單按鈕 */
#loadMembers {
  background: linear-gradient(135deg, #0d9488, #0f766e);
  border-color: #14b8a6;
}

/* 登出按鈕 */
#logout {
  background: linear-gradient(135deg, #475569, #334155);
  border-color: #64748b;
}
    /* ===== 全站資料顯示美化 ===== */

.status {
  background: linear-gradient(145deg, #1e293b, #111827);
  border: 1px solid #334155;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 8px 24px rgba(0,0,0,.2);
  text-align: left;
}

.status h3 {
  color: #fbbf24;
  padding-bottom: 10px;
  border-bottom: 1px solid #334155;
}

.status h4 {
  color: #93c5fd;
}

.status hr {
  border: 0;
  border-top: 1px solid #334155;
  margin: 22px 0;
}

.status input,
.status select {
  width: 100%;
  max-width: 100%;
  padding: 12px 14px;
  margin: 7px 0;
  border-radius: 10px;
  border: 1px solid #475569;
  background: #0f172a;
  color: #f1f5f9;
  font-size: 15px;
}

.status input:focus,
.status select:focus {
  outline: 2px solid #3b82f6;
  border-color: #60a5fa;
}

.status table {
  width: 100%;
  border-collapse: collapse;
  min-width: 650px;
  font-size: 14px;
}

.status th {
  background: #334155;
  color: #fbbf24;
  padding: 13px 10px;
  text-align: left;
  white-space: nowrap;
}

.status td {
  padding: 12px 10px;
  border-bottom: 1px solid #334155;
}

.status tr:hover td {
  background: #263449;
}

#memberList {
  overflow-x: auto;
  border-radius: 12px;
}

#vipPickList > div {
  border: 1px solid #475569;
  border-radius: 14px;
  background: linear-gradient(145deg, #1e293b, #111827);
  padding: 18px;
  margin: 14px 0;
}

#vipPickList h4 {
  color: #fbbf24;
}

#vipNumberArea,
#vipSpecialNumberArea,
#vipSecondNumberArea {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  justify-content: flex-start;
}

/* 可收摺區塊統一樣式 */

.status details {
  margin: 14px 0;
  border: 1px solid #475569;
  border-radius: 12px;
  background: #172337;
  overflow: hidden;
}

.status details summary {
  padding: 15px 18px;
  color: #fbbf24;
  font-weight: 700;
  cursor: pointer;
  list-style: none;
}

.status details summary::-webkit-details-marker {
  display: none;
}

.status details summary::after {
  content: "＋";
  float: right;
  color: #93c5fd;
}

.status details[open] summary::after {
  content: "－";
}

.status details .details-content {
  padding: 16px;
  border-top: 1px solid #334155;
}

@media (max-width: 600px) {
  body {
    padding: 14px 10px;
  }

  header {
    padding: 22px 8px;
  }

  .status {
    padding: 16px 12px;
  }

  .game {
    padding: 18px;
  }

  button {
    max-width: 100%;
  }
}
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>台灣彩券分析平台</h1>
      <p class="subtitle">三大彩券開獎資料與數據分析</p>
    </header>

    <section class="games">
      <article class="game">
        <h2>大樂透</h2>
        <p>6 個號碼：1～49</p>
        <p>特別號：1～49</p>
      </article>

      <article class="game">
        <h2>今彩 539</h2>
        <p>5 個號碼：1～39</p>
      </article>

      <article class="game">
        <h2>威力彩</h2>
        <p>第一區：6 個號碼，1～38</p>
        <p>第二區：1 個號碼，1～8</p>
      </article>
    </section>

    </section>

    <!-- 開獎紀錄入口 -->
    <section class="status">
      <h3>歷史開獎紀錄</h3>
      <p>查詢三大彩券官方歷史開獎資料。</p>

      <div style="display:flex;flex-wrap:wrap;gap:10px">
        <button id="showLotto649">大樂透開獎紀錄</button>
        <button id="showLotto539">今彩539開獎紀錄</button>
        <button id="showPowerLottery">威力彩開獎紀錄</button>
      </div>

      <div id="drawHistory" style="margin-top:20px">
        <p>請選擇要查看的彩券。</p>
      </div>
    </section>

    <section class="status" id="memberStatus">
      <p>會員登入與管理功能</p>
    </section>

    <footer>
      本平台僅提供歷史資料與統計分析，不保證中獎。
    </footer>
  </main>
  

<script type="module">
  import {
  auth,
  db,
  onAuthStateChanged,
  signInAnonymously,
  signInWithEmailAndPassword,
  signOut,
  sendEmailVerification,
  sendPasswordResetEmail,
  EmailAuthProvider,
  linkWithCredential,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  serverTimestamp,
  collection,
  getDocs
} from "./firebase.js";

  const status = document.getElementById("memberStatus");
  // ================================
// 三大彩券歷史開獎紀錄
// ================================
// 記錄目前展開的彩券
let currentHistoryGame = null;
async function loadDrawHistory(game) {
  const area = document.getElementById("drawHistory");

  area.textContent = "正在讀取開獎資料……";

  try {
    const snapshot = await getDocs(collection(db, game.collection));

    // 排除 TEST 測試資料，並依日期由新到舊排序
    const records = snapshot.docs
      .map(doc => doc.data())
      .filter(item =>
        item.period &&
        !String(item.period).startsWith("TEST")
      )
      .sort((a, b) => {
        const dateCompare = String(b.date || "")
          .localeCompare(String(a.date || ""));

        return dateCompare ||
          String(b.period).localeCompare(String(a.period));
      });

    area.innerHTML = "";

    const heading = document.createElement("h3");
    heading.textContent = game.name + "歷史開獎紀錄（" +
      records.length + " 期）";
    area.appendChild(heading);

    if (records.length === 0) {
      area.textContent = "目前沒有可顯示的開獎資料。";
      return;
    }

// 搜尋與年份篩選區
const filterArea = document.createElement("div");
filterArea.style.cssText =
  "display:flex;flex-wrap:wrap;gap:10px;margin:15px 0";

const searchInput = document.createElement("input");
searchInput.type = "text";
searchInput.placeholder = "輸入開獎號碼，例如 22";
searchInput.style.cssText =
  "flex:1;min-width:180px;padding:10px;border-radius:8px;border:1px solid #64748b;background:#1e293b;color:white";
const specialSearchInput = document.createElement("input");
specialSearchInput.type = "text";
specialSearchInput.placeholder = "搜尋特別號";
specialSearchInput.style.cssText =
  "flex:1;min-width:140px;padding:10px;border-radius:8px;border:1px solid #f59e0b;background:#1e293b;color:white";
const yearSelect = document.createElement("select");
yearSelect.style.cssText =
  "padding:10px;border-radius:8px;border:1px solid #64748b;background:#1e293b;color:white";

const allOption = document.createElement("option");
allOption.value = "";
allOption.textContent = "全部年份";
yearSelect.appendChild(allOption);

// 自動整理資料中存在的年份
const years = [...new Set(
  records
    .map(item => String(item.date || "").slice(0, 4))
    .filter(year => /^\d{4}$/.test(year))
)].sort((a, b) => b.localeCompare(a));

years.forEach(year => {
  const option = document.createElement("option");
  option.value = year;
  option.textContent = year + " 年";
  yearSelect.appendChild(option);
});

filterArea.appendChild(searchInput);

// 大樂透、威力彩才顯示特別號／第二區搜尋
if (game.extraField) {
  filterArea.appendChild(specialSearchInput);
}

filterArea.appendChild(yearSelect);
area.appendChild(filterArea);

// 結果筆數
const resultCount = document.createElement("p");
area.appendChild(resultCount);

// 建立表格
const table = document.createElement("table");
table.style.cssText =
  "width:100%;border-collapse:collapse;margin-top:12px";

const thead = document.createElement("thead");
const headerRow = document.createElement("tr");

["期別", "開獎日期", "開獎號碼", "特別號／第二區"]
  .forEach(label => {
    const th = document.createElement("th");
    th.textContent = label;
    th.style.cssText =
      "padding:10px;border-bottom:1px solid #475569;text-align:center";
    headerRow.appendChild(th);
  });

thead.appendChild(headerRow);
table.appendChild(thead);

const tbody = document.createElement("tbody");
table.appendChild(tbody);

const wrapper = document.createElement("div");
wrapper.style.cssText = "overflow-x:auto";
wrapper.appendChild(table);
area.appendChild(wrapper);

// ================================
// 歷史紀錄搜尋、篩選與分頁
// ================================

const pageSize = 20;
let currentPage = 1;

// 分頁控制區
const pagination = document.createElement("div");
pagination.style.cssText =
  "display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;margin:20px 0";

const prevButton = document.createElement("button");
prevButton.textContent = "上一頁";

const pageInfo = document.createElement("span");

const nextButton = document.createElement("button");
nextButton.textContent = "下一頁";

[prevButton, nextButton].forEach(button => {
  button.style.cssText =
    "padding:9px 16px;border:1px solid #64748b;border-radius:8px;background:#334155;color:white;cursor:pointer";
});

pagination.append(prevButton, pageInfo, nextButton);
area.appendChild(pagination);

// 依搜尋條件更新紀錄
function renderFilteredRecords() {
const keyword = searchInput.value.trim().toLowerCase();
const specialKeyword = specialSearchInput.value.trim();
const selectedYear = yearSelect.value;

const filtered = records.filter(item => {

  // 開獎日期，只用於年份篩選
  const date = String(item.date || "");

 // 一般號碼：只搜尋第一區
const drawNumbers = (item.numbers || [])
  .map(number => String(number));

// 特別號或第二區：獨立搜尋
const extraNumber = game.extraField
  ? String(item[game.extraField] ?? "")
  : "";

const matchesSpecial =
  !specialKeyword ||
  extraNumber === specialKeyword;

  // 支援多個號碼，以空格、逗號分隔
  const keywords = keyword
    .split(/[\s,，、]+/)
    .filter(Boolean);

  // 必須完整符合號碼，不搜尋日期或期別
 const matchesKeyword =
  keywords.length === 0 ||
  keywords.every(number =>
    drawNumbers.includes(number)
  );

  // 年份獨立篩選
  const matchesYear =
    !selectedYear || date.startsWith(selectedYear);

  return matchesKeyword && matchesSpecial && matchesYear;
});

  const totalPages = Math.max(
    1,
    Math.ceil(filtered.length / pageSize)
  );

  currentPage = Math.min(currentPage, totalPages);

  const startIndex = (currentPage - 1) * pageSize;
  const pageRecords = filtered.slice(
    startIndex,
    startIndex + pageSize
  );

  tbody.innerHTML = "";

  pageRecords.forEach(item => {
    const tr = document.createElement("tr");

    const extraNumber = game.extraField
      ? item[game.extraField]
      : "";

    const values = [
      item.period,
      item.date || "",
      (item.numbers || []).join("、"),
      extraNumber === undefined || extraNumber === null
        ? "—"
        : extraNumber
    ];

   values.forEach((value, index) => {
  const td = document.createElement("td");

  td.style.cssText =
    "padding:10px;border-bottom:1px solid #334155;text-align:center";

  // 第三欄：開獎號碼圓球
  if (index === 2) {
    const numberArea = document.createElement("div");

    numberArea.style.cssText =
      "display:flex;flex-wrap:wrap;justify-content:center;gap:5px";

    (item.numbers || []).forEach(number => {
      const ball = document.createElement("span");

      ball.textContent = number;

      ball.style.cssText = `
        display:inline-flex;
        justify-content:center;
        align-items:center;
        width:34px;
        height:34px;
        border-radius:50%;
        background:#2563eb;
        color:white;
        font-weight:bold;
        font-size:14px;
      `;

      numberArea.appendChild(ball);
    });

    td.appendChild(numberArea);

  // 第四欄：特別號或第二區
  } else if (index === 3 && value !== "—") {
    const ball = document.createElement("span");

    ball.textContent = value;

    ball.style.cssText = `
      display:inline-flex;
      justify-content:center;
      align-items:center;
      width:34px;
      height:34px;
      border-radius:50%;
      background:#d97706;
      color:white;
      font-weight:bold;
      font-size:14px;
    `;

    td.appendChild(ball);

  } else {
    td.textContent = String(value);
  }

  tr.appendChild(td);
});

    // 加入開獎紀錄
    tbody.appendChild(tr);

    // 點擊該期紀錄，展開詳細資訊
    tr.style.cursor = "pointer";
    tr.title = "點擊查看本期詳細資訊";

    tr.onclick = () => {
      const nextRow = tr.nextElementSibling;

      // 如果已經展開，再點擊就收摺
      if (
        nextRow &&
        nextRow.dataset.detailRow === "true"
      ) {
        nextRow.remove();
        return;
      }

      // 建立詳細資訊列
      const detailRow = document.createElement("tr");
      detailRow.dataset.detailRow = "true";

      const detailCell = document.createElement("td");
      detailCell.colSpan = 4;

      detailCell.style.cssText = `
        padding:16px;
        background:#1e293b;
        border-bottom:1px solid #475569;
      `;

      const mainNumbers = item.numbers || [];
      const sum = mainNumbers.reduce(
        (total, number) => total + Number(number), 0
      );

      const oddCount = mainNumbers.filter(
        number => Number(number) % 2 === 1
      ).length;

      const evenCount = mainNumbers.length - oddCount;

      const extraNumber = game.extraField
        ? item[game.extraField]
        : null;

      const detailTitle = document.createElement("h4");
      detailTitle.textContent =
        item.period + " 開獎詳細資訊";

      const dateText = document.createElement("p");
      dateText.textContent =
        "開獎日期：" + (item.date || "未提供");

      const numberText = document.createElement("p");
      numberText.textContent =
        "一般號碼：" + mainNumbers.join("、");

      const extraText = document.createElement("p");

      if (game.extraField) {
        extraText.textContent =
          (game.name === "大樂透" ? "特別號：" : "第二區：") +
          (extraNumber ?? "未提供");
      } else {
        extraText.textContent = "本期無特別號或第二區";
      }

      const sumText = document.createElement("p");
      sumText.textContent = "一般號碼總和：" + sum;

      const oddEvenText = document.createElement("p");
      oddEvenText.textContent =
        "奇偶分布：" + oddCount + " 奇 " +
        "／" + evenCount + " 偶";

      [
        detailTitle,
        dateText,
        numberText,
        extraText,
        sumText,
        oddEvenText
      ].forEach(element => {
        element.style.margin = "6px 0";
        detailCell.appendChild(element);
      });

      detailRow.appendChild(detailCell);

      // 插入在目前紀錄的下一列
      tr.after(detailRow);
    };
  }); // 結束 pageRecords.forEach
  const firstRecord = filtered.length
    ? startIndex + 1
    : 0;

  const lastRecord = Math.min(
    startIndex + pageSize,
    filtered.length
  );

  resultCount.textContent =
    `搜尋結果：${filtered.length} 期（顯示第 ${firstRecord}～${lastRecord} 筆）`;

  pageInfo.textContent =
    `第 ${currentPage} / ${totalPages} 頁`;

  prevButton.disabled = currentPage <= 1;
  nextButton.disabled = currentPage >= totalPages;

  prevButton.style.opacity =
    prevButton.disabled ? "0.4" : "1";

  nextButton.style.opacity =
    nextButton.disabled ? "0.4" : "1";
}

// 上一頁
prevButton.onclick = () => {
  if (currentPage > 1) {
    currentPage--;
    renderFilteredRecords();
  }
};

// 下一頁
nextButton.onclick = () => {
  currentPage++;
  renderFilteredRecords();
};

// 搜尋或切換年份時回到第一頁
searchInput.addEventListener("input", () => {
  currentPage = 1;
  renderFilteredRecords();
});
specialSearchInput.addEventListener("input", () => {
  currentPage = 1;
  renderFilteredRecords();
});
yearSelect.addEventListener("change", () => {
  currentPage = 1;
  renderFilteredRecords();
});

// 初次顯示
renderFilteredRecords();

  } catch (error) {
    console.error("開獎紀錄讀取失敗：", error);
    area.textContent =
      "讀取失敗：" + error.message +
      "。請確認已登入會員或訪客帳號。";
  }
}

// 三大彩券按鈕：再次點擊收摺，並更新按鈕文字
const historyButtonLabels = {
  showLotto649: "大樂透開獎紀錄",
  showLotto539: "今彩539開獎紀錄",
  showPowerLottery: "威力彩開獎紀錄"
};

function toggleDrawHistory(buttonId, game) {
  const area = document.getElementById("drawHistory");
  const button = document.getElementById(buttonId);

  button.onclick = () => {

    // 再按一次目前的按鈕，就收摺
    if (currentHistoryGame === game.collection) {
      currentHistoryGame = null;
      area.innerHTML = "<p>請選擇要查看的彩券。</p>";
      button.textContent = historyButtonLabels[buttonId];
      return;
    }

    // 先恢復所有按鈕原本的文字
    Object.entries(historyButtonLabels).forEach(([id, label]) => {
      document.getElementById(id).textContent = label;
    });

    // 展開新選擇的彩券
    currentHistoryGame = game.collection;
    button.textContent = "收起" + game.name + "紀錄";

    loadDrawHistory(game);
  };
}

toggleDrawHistory("showLotto649", {
  name: "大樂透",
  collection: "draws_lotto649",
  extraField: "specialNumber"
});

toggleDrawHistory("showLotto539", {
  name: "今彩539",
  collection: "draws_lotto539"
});

toggleDrawHistory("showPowerLottery", {
  name: "威力彩",
  collection: "draws_powerlottery",
  extraField: "secondNumber"
});
// VIP 自選號碼功能

function setupVipNumberPicker() {
  const gameSelect = document.getElementById("vipGame");
  const numberArea = document.getElementById("vipNumberArea");
  const numberTitle = document.getElementById("vipNumberTitle");
  const secondArea = document.getElementById("vipSecondArea");
  const secondNumberArea = document.getElementById("vipSecondNumberArea");
  const specialArea = document.getElementById("vipSpecialArea");
  const specialNumberArea = document.getElementById("vipSpecialNumberArea");
  const message = document.getElementById("vipPickMessage");

  if (!gameSelect || !numberArea) return;

  const gameRules = {
    lotto649: { max: 49, count: 6 },
    lotto539: { max: 39, count: 5 },
    powerlottery: { max: 38, count: 6, secondMax: 8 }
  };

  const selection = {
    game: "lotto649",
    numbers: [],
    secondNumber: null,
    specialNumber: null
  };

  window.vipPickSelection = selection;

  function renderNumbers(container, max, selected, area, count, excluded = []) {
    container.innerHTML = "";

    for (let n = 1; n <= max; n++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = n;
      btn.dataset.number = n;
      btn.dataset.area = area;

      const active = selected.includes(n);
      const blocked = excluded.includes(n) && !active;

      btn.disabled = blocked;

btn.style.cssText = `
  width:46px;
  height:46px;
  margin:5px;
  border-radius:50%;
  border:1px solid ${
    active ? "#a78bfa" : blocked ? "#475569" : "#475569"
  };
  background:${
    active
      ? "linear-gradient(135deg,#7c3aed,#2563eb)"
      : blocked
        ? "#334155"
        : "linear-gradient(145deg,#1e293b,#0f172a)"
  };
  color:${active ? "#ffffff" : "#cbd5e1"};

  member.email || "無資料",
  member.role || "member",
  member.vip === true ? "VIP" : "一般會員",
  created,
  member.vip === true
    ? (member.vipExpiresAt || "永久")
    : "—"
];
values.forEach(value => {
  const td = document.createElement("td");
  td.textContent = value;
  td.style.padding = "10px";
  td.style.borderBottom = "1px solid #334155";
  tr.appendChild(td);
});

// VIP 管理操作欄
const actionTd = document.createElement("td");
actionTd.style.padding = "10px";
actionTd.style.borderBottom = "1px solid #334155";

const vipButton = document.createElement("button");

if (member.vip === true) {
  vipButton.textContent = "取消 VIP";
  vipButton.style.background = "#b91c1c";
} else {
  vipButton.textContent = "升級 VIP";
  vipButton.style.background = "#0d9488";
}


vipButton.onclick = async () => {
  const isVip = member.vip === true;
  let expiryDate = null;
  let expiryTimestamp = null;
  if (isVip) {
    if (!confirm(`確定要取消 ${member.email} 的 VIP 資格嗎？`)) {
      return;
    }
  } else {
    // 建立 VIP 期限選單
    const choice = document.createElement("div");

    choice.style.cssText = `
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.75);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:99999;
      padding:20px;
    `;

    choice.innerHTML = `
      <div style="
        background:#1e293b;
        color:white;
        padding:24px;
        border-radius:16px;
        width:100%;
        max-width:360px;
      ">
        <h3 style="margin-top:0">選擇 VIP 期限</h3>

        <select id="vipDuration" style="
          width:100%;
          padding:12px;
          margin-bottom:16px;
          border-radius:8px;
          font-size:16px;
        ">
          <option value="0">永久 VIP</option>
          <option value="30">30 天</option>
          <option value="90">90 天</option>
          <option value="180">180 天</option>
          <option value="365">365 天</option>
          <option value="custom">自訂到期日</option>
        </select>

        <input id="vipCustomDate"
          type="date"
          style="
            display:none;
            width:100%;
            padding:12px;
            margin-bottom:16px;
            box-sizing:border-box;
          "
        >

        <div style="display:flex;gap:10px">
          <button id="vipCancel" style="
            flex:1;padding:12px;border:0;
            border-radius:8px;background:#64748b;color:white;
          ">取消</button>

          <button id="vipConfirm" style="
            flex:1;padding:12px;border:0;
            border-radius:8px;background:#2563eb;color:white;
          ">確認升級</button>
        </div>
      </div>
    `;

    document.body.appendChild(choice);

    const duration = choice.querySelector("#vipDuration");
    const customDate = choice.querySelector("#vipCustomDate");

    duration.onchange = () => {
      customDate.style.display =
        duration.value === "custom" ? "block" : "none";
    };

    const selected = await new Promise(resolve => {
      choice.querySelector("#vipCancel").onclick = () => {
        choice.remove();
        resolve(null);
      };

      choice.querySelector("#vipConfirm").onclick = () => {
        const value = duration.value;

        if (value === "custom") {
          const date = customDate.value;
          const today = new Date();
          today.setHours(0, 0, 0, 0);

          if (!date || new Date(date + "T00:00:00") <= today) {
            alert("請選擇有效的未來到期日！");
            return;
          }

          choice.remove();
          resolve(date);
        } else {
          choice.remove();
          resolve(value);
        }
      };
    });

    if (selected === null) return;

    if (selected === "0") {
      expiryDate = null;
    } else if (selected === "custom") {
      return;
    } else if (selected.match(/^\d{4}-\d{2}-\d{2}$/)) {
      expiryDate = selected;
    } else {
      const date = new Date();
      date.setDate(date.getDate() + Number(selected));

      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      expiryDate = `${year}-${month}-${day}`;
    }
  }
// 設定 VIP 到期時間：到期日當天有效，隔天 00:00 失效
if (!isVip && expiryDate) {
  expiryTimestamp = new Date(`${expiryDate}T00:00:00`);
  expiryTimestamp.setDate(expiryTimestamp.getDate() + 1);
}
  const action = isVip ? "取消 VIP" : "升級 VIP";

  vipButton.disabled = true;

  try {
await updateDoc(doc(db, "users", member.uid), {
  vip: !isVip,
  vipExpiresAt: isVip ? null : expiryDate,
  vipExpiresAtTimestamp: isVip ? null : expiryTimestamp,
  vipUpdatedAt: serverTimestamp()
});

    alert(`${action}成功！`);
    document.getElementById("loadMembers").click();

  } catch (error) {
    console.error("VIP 更新失敗：", error);
    alert("操作失敗：" + error.message);
    vipButton.disabled = false;
  }
};

actionTd.appendChild(vipButton);
tr.appendChild(actionTd);

tbody.appendChild(tr);

}); // 結束 members.forEach

table.appendChild(tbody);
      area.appendChild(table);

    } catch (error) {
      console.error("會員清單讀取失敗：", error);
      area.textContent = "讀取失敗：" + error.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "重新載入會員清單";
    }
  };
}

    document.getElementById("memberEmail").textContent =
      "帳號：" + (user.email || "");

    document.getElementById("verifyStatus").textContent =
      user.emailVerified
        ? "電子郵件已驗證"
        : "電子郵件尚未驗證";

    document.getElementById("resendVerify").style.display =
      user.emailVerified ? "none" : "inline-block";

    document.getElementById("resendVerify").onclick =
      async () => {
        try {
          await sendEmailVerification(user);
          alert("驗證信已重新寄出，請檢查電子信箱。");
        } catch (error) {
          alert("寄送失敗：" + error.message);
        }
      };

    document.getElementById("logout").onclick =
      () => signOut(auth);

  } catch (error) {

    console.error("會員資料讀取失敗：", error);

    status.innerHTML = `
      <h3>會員資料讀取失敗</h3>
      <p id="errorMessage"></p>
      <button id="logout">登出</button>
    `;

    document.getElementById("errorMessage").textContent =
      error.message;

    document.getElementById("logout").onclick =
      () => signOut(auth);
  }

});
</script>
</body>
</html>
