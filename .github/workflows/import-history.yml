name: Import 2026 Lottery History

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: "只驗證 Firebase 金鑰，不匯入資料"
        required: true
        type: boolean
        default: true

jobs:
  import-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: node --check scripts/import-history.mjs
      - name: Validate Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'NODE'
          const raw = process.env.FIREBASE_SERVICE_ACCOUNT;

          if (!raw) {
            throw new Error("找不到 Firebase Secret");
          }

          const account = JSON.parse(raw);

          if (account.project_id !== "taiwan-lottery-platform") {
            throw new Error("Firebase 專案 ID 不正確");
          }

          if (!account.private_key || !account.client_email) {
            throw new Error("Firebase 金鑰欄位不完整");
          }

          console.log("Firebase Secret 格式及專案 ID 驗證成功");
          NODE
      - name: Preview lottery history
        if: ${{ inputs.validate_only == false }}
        run: npm run import-history
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PREVIEW_ONLY: "true"
