name: Check Lottery API

on:
  workflow_dispatch:

jobs:
  check-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check official lottery API
        run: node scripts/check-api.mjs
